    const data=new Uint8Array(an.frequencyBinCount); const bars=[...document.querySelectorAll('#wave b')];
    s.lv=setInterval(()=>{ an.getByteFrequencyData(data); bars.forEach((b,i)=>{ const v=data[Math.min(data.length-1,i+1)]/255; b.style.height=(8+v*52)+'px'; }); },90);
  }catch(_){}
}

$('endBtn').onclick=endByUser;

window.__call={get state(){return S;},startCall,loadInfo};
loadInfo(); setInterval(()=>{ if(!document.hidden) loadInfo(); },15000);
})();
