<style>
:root{--bg0:#0B0820;--bg1:#1E1250;--cy:#B9A0FF;--bl:#6D3FD1;--ok:#14A36F;--ok2:#0E8A5B;--bad:#F87171;--warn:#FBBF24;--tx:#EAF2FF;--tx2:#9DB1D3;--tx3:#6C7FA3;--glass:rgba(255,255,255,.055);--gl-b:rgba(255,255,255,.11);--card:rgba(20,12,56,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(110% 70% at 80% -10%,#4A2A9E 0%,transparent 58%),radial-gradient(90% 60% at 0% 110%,#2B1A6B 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;overflow:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:stretch;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));max-width:460px;margin:0 auto;gap:12px}
/* شريط الحالة العلوي */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--gl-b);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;color:var(--tx)}
.brand i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cy),var(--bl));color:#fff;font-style:normal;font-weight:900;font-size:15px;box-shadow:0 4px 14px rgba(185,160,255,.35)}
.brand small{display:block;font-weight:600;font-size:10.5px;color:var(--tx3);letter-spacing:.3px;margin-top:1px}
.sec{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--tx2)}
.sec svg{width:14px;height:14px;color:var(--cy)}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.hide{display:none!important}
/* بطاقة الخدمة */
.card{margin:auto 0;border-radius:26px;padding:22px 18px 18px;text-align:center;background:linear-gradient(180deg,rgba(60,36,132,.5),var(--card));border:1px solid var(--gl-b);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:32px;font-weight:900;color:#031024;background:linear-gradient(135deg,var(--cy),var(--bl));box-shadow:0 12px 30px rgba(185,160,255,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.dept{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--cy)}
.shop{font-size:26px;font-weight:800;line-height:1.3;margin:0;word-break:break-word}
.desc{color:var(--tx2);font-size:14.5px;line-height:1.8;margin:0;max-width:310px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--gl-b);font-size:13.5px;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:#7C8CA8;flex:none}
.chip.on{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12);color:#BBF7D0}
.chip.on .dot{background:var(--ok);animation:blink 1.8s infinite}
.chip.off{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1);color:#FECACA}
.chip.off .dot{background:var(--bad)}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%,100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.feats div{padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);font-size:11.5px;font-weight:700;color:var(--tx2);line-height:1.5}
.feats b{display:block;font-size:17px;margin-bottom:2px}
/* زر الاتصال */
.callwrap{position:relative;width:100%;max-width:340px;margin:4px 0 0}
.callwrap::before,.callwrap::after{content:"";pointer-events:none;position:absolute;inset:0;border-radius:99px;border:2px solid rgba(34,197,94,.55);animation:ring 2.4s ease-out infinite}
.callwrap::after{animation-delay:1.2s}
.callwrap.idle::before,.callwrap.idle::after{animation:none;opacity:0}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.14,1.5);opacity:0}}
.callbtn{position:relative;width:100%;height:68px;border-radius:99px;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:800;letter-spacing:.2px;background:linear-gradient(180deg,#34D679 0%,var(--ok) 45%,var(--ok2) 100%);box-shadow:0 12px 32px rgba(34,197,94,.45),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s,filter .2s}
.callbtn .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);flex:none}
.callbtn .ico svg{width:23px;height:23px}
.callbtn .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.callbtn .lbl small{font-size:11.5px;font-weight:600;opacity:.9}
.callbtn:active:not(:disabled){transform:scale(.97);box-shadow:0 6px 18px rgba(34,197,94,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.callbtn:disabled{background:linear-gradient(180deg,#46536E,#37425A);color:#AAB6CE;box-shadow:inset 0 2px 0 rgba(255,255,255,.12);cursor:not-allowed}
.callbtn:disabled .ico{background:rgba(255,255,255,.1)}
.hint{font-size:12px;color:var(--tx3);line-height:1.9}
.link{background:none;border:0;color:var(--cy);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px;min-height:40px}
.nm{width:100%;max-width:260px;padding:12px 14px;border-radius:14px;border:1px solid var(--gl-b);background:rgba(255,255,255,.06);color:var(--tx);font-size:15px;text-align:center;outline:none}
.nm:focus{border-color:var(--cy)}
.msg{padding:12px 16px;border-radius:14px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#FFD5D5;font-size:14px;line-height:1.8;width:100%}
.msg.info{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.45);color:#D6E6FF}
.foot{text-align:center;font-size:11px;color:var(--tx3)}
/* شاشة المكالمة */
.live{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.livebar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--gl-b);font-size:12.5px;font-weight:800;color:var(--tx2)}
.livebar .dot{background:var(--warn)}.livebar.up .dot{background:var(--ok);animation:blink 1.8s infinite}
.q{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-inline-start:6px}.q i{width:4px;background:rgba(255,255,255,.25);border-radius:2px}.q i:nth-child(1){height:5px}.q i:nth-child(2){height:9px}.q i:nth-child(3){height:14px}
.q.l1 i:nth-child(-n+1),.q.l2 i:nth-child(-n+2),.q.l3 i{background:var(--ok)}.q.l1 i:nth-child(1){background:var(--warn)}
.avatar{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;color:#fff;background:linear-gradient(135deg,#8B5CF6,var(--bl));box-shadow:0 10px 36px rgba(185,160,255,.35)}
.avatar.rip::before,.avatar.rip::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(185,160,255,.5);animation:rip 2.2s ease-out infinite}

.timer{font-variant-numeric:tabular-nums;font-size:40px;font-weight:300;letter-spacing:3px;min-height:50px;direction:ltr}
.status{font-size:15px;color:var(--tx2);min-height:24px}
.diag{font-size:13px;line-height:1.7;min-height:22px;max-width:320px;color:var(--tx2)}.diag.warn{color:#FDE68A}.diag.good{color:#86EFAC}
.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:60px}
.wave b{width:5px;height:8px;border-radius:5px;background:linear-gradient(180deg,var(--cy),var(--bl));transition:height .09s linear}
.wave.ring b{animation:wv 1.2s ease-in-out infinite}
.wave.ring b:nth-child(2n){animation-delay:.2s}.wave.ring b:nth-child(3n){animation-delay:.4s}.wave.ring b:nth-child(5n){animation-delay:.6s}
@keyframes wv{0%,100%{height:8px;opacity:.5}50%{height:30px;opacity:1}}
.ctl{display:flex;gap:30px;align-items:flex-start;justify-content:center;margin-top:6px}
.ctl>div{display:flex;flex-direction:column;align-items:center;gap:8px}
.rb{width:68px;height:68px;border-radius:50%;border:1px solid var(--gl-b);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer}
.rb svg{width:28px;height:28px}
.rb.on{background:#fff;color:#0A1E44}
.endbtn{width:76px;height:76px;border-radius:50%;border:0;background:linear-gradient(180deg,#FB7185,#E11D48);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 30px rgba(225,29,72,.5),inset 0 2px 0 rgba(255,255,255,.3)}
.endbtn svg{width:34px;height:34px;transform:rotate(135deg);color:#fff}

/* بعد المكالمة */
.sum{display:flex;gap:10px;width:100%}.sum div{flex:1;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.sum b{display:block;font-size:18px}.sum small{color:var(--tx3);font-size:11.5px}

/* ===== واجهة العميل: متجر + خدمة عملاء (إضافة فوق نظام الاتصال) ===== */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

<script>
(function(){

const SUPA='https://buvixsokavrxuwpikefl.supabase.co', KEY='sb_publishable_UzXzPaiuLgDhjVtsFVXeYQ_XlpDbUvN';

async function rpc(name,args,keep){
  const r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{}),keepalive:!!keep});

/* ---------- خلفية الشبكة (خفيفة) ---------- */
(function(){ const c=$('net'), x=c.getContext('2d'); let w,h,P=[],raf,on=true;
  function size(){ const d=Math.min(devicePixelRatio||1,2); w=c.width=innerWidth*d; h=c.height=innerHeight*d; x.setTransform(1,0,0,1,0,0); P=[]; const n=Math.round(Math.min(46,innerWidth*innerHeight/22000)); for(let i=0;i<n;i++) P.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25*d,vy:(Math.random()-.5)*.25*d}); }
  function draw(){ if(!on) return; x.clearRect(0,0,w,h); const L=150*(devicePixelRatio||1);
    for(let i=0;i<P.length;i++){ const p=P[i]; p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1;
      for(let j=i+1;j<P.length;j++){ const q=P[j], dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy); if(d<L){ x.strokeStyle='rgba(185,160,255,'+(.22*(1-d/L))+')'; x.lineWidth=1; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(q.x,q.y); x.stroke(); } }
      x.fillStyle='rgba(214,200,255,.7)'; x.beginPath(); x.arc(p.x,p.y,1.6*(devicePixelRatio||1),0,7); x.fill(); }
    raf=requestAnimationFrame(draw); }
  addEventListener('resize',size); document.addEventListener('visibilitychange',()=>{ on=!document.hidden; if(on) draw(); else cancelAnimationFrame(raf); });
  size(); if(!matchMedia('(prefers-reduced-motion:reduce)').matches) draw();
})();

/* ---------- شاشة المحل ---------- */
function show(id){ ['home','call','done'].forEach(s=>$(s).classList.toggle('hide',s!==id)); }

let busyFlag=false;
function paintAvail(){ const ok=avail&&!busyFlag; const a=$('avail'); a.className='chip '+(ok?'on':'off'); $('availTx').textContent=ok?'المحل متاح للرد دلوقتي':(avail&&busyFlag?'المحل على مكالمة تانية دلوقتي':'المحل غير متاح حالياً'); $('callBtn').disabled=!ok||!!S; $('cw').classList.toggle('idle',!ok||!!S); }
let infoBusy=false;
async function loadInfo(){
  if(infoBusy||S) return; infoBusy=true;
  try{
    if(!TOKEN){ showErr('رابط المحل غير مكتمل. اطلب من المحل يبعتلك الرابط الصحيح.'); $('shop').textContent='رابط غير صالح'; avail=false; paintAvail(); return; }

    if(!d||!d.ok){ $('shop').textContent='المحل مش متاح'; showErr('الرابط ده غير صالح أو المكالمات متوقفة عند المحل.'); avail=false; paintAvail(); return; }
    shopName=d.name||'المحل'; if(Array.isArray(d.ice)&&d.ice.length) ice=d.ice; $('shop').textContent=shopName; $('logo').textContent=(shopName.trim()[0]||'م'); avail=!!d.available; busyFlag=!!d.busy; paintAvail(); if(!$('err').classList.contains('info')||avail) showErr('');

}

{ const sv=T('gm_call_name'); if(sv){ $('nmLink').textContent='الاسم: '+sv+' (تعديل)'; } }

/* ---------- WebRTC ---------- */
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function gather(pc,ms){ return new Promise(res=>{ if(pc.iceGatheringState==='complete') return res(); const t=setTimeout(done,ms); function done(){ clearTimeout(t); pc.removeEventListener('icegatheringstatechange',chk); res(); } function chk(){ if(pc.iceGatheringState==='complete') done(); } pc.addEventListener('icegatheringstatechange',chk); }); }
/* تشخيص الصوت: بيوضّح لو المايك مش بيبعت أو الصوت مش واصل أو المتصفح منع التشغيل */
function diag(s){
  const pc=s.pc, el=$('remote'), d=$('diag'); let last={rx:0,tx:0,en:0}, still=0, waited=0;
  s.dg=setInterval(async()=>{ if(S!==s||pc.connectionState!=='connected') return;
    try{ const st=await pc.getStats(); let rx=0,tx=0,en=null; st.forEach(r=>{ if(r.type==='inbound-rtp'&&r.kind==='audio'){ rx+=r.bytesReceived||0; if(r.totalAudioEnergy!=null) en=(en||0)+r.totalAudioEnergy; } if(r.type==='outbound-rtp'&&r.kind==='audio') tx+=r.bytesSent||0; });
      let rtt=null; st.forEach(r=>{ if(r.type==='candidate-pair'&&(r.nominated||r.selected)&&r.currentRoundTripTime!=null) rtt=r.currentRoundTripTime; }); if(rtt!=null) $('qual').className='q '+(rtt<0.15?'l3':rtt<0.4?'l2':'l1');
      const mic=s.stream&&s.stream.getAudioTracks()[0]; const micOk=mic&&mic.readyState==='live'&&!mic.muted;
      if(el.srcObject&&el.paused){ el.play().catch(()=>{ $('unmute').classList.remove('hide'); }); } else $('unmute').classList.add('hide');
      still=(rx>last.rx)?0:still+1; if(en!=null&&en>last.en+2e-5){ s.heard=true; s.heardAt=Date.now(); } last={rx,tx,en:en||0}; s.rx=rx; s.tx=tx; s.en=en; waited++;
      if(!micOk){ d.className='diag warn'; d.textContent='الميكروفون عندك مش شغّال. اتأكد إنه مش مستخدم في تطبيق أو تبويب تاني.'; }
      else if(rx===0&&still>=3){ d.className='diag warn'; d.textContent='الاتصال تمّ بس مفيش بيانات صوت واصلة من المحل. ممكن الشبكة أو الميكروفون عند المحل.'; }
      else if(en==null){ d.className='diag'; d.textContent='الاتصال شغّال (المتصفح ده مبيقيسش مستوى الصوت الوارد).'; }
      else if(s.heard){ d.className='diag good'; d.textContent='وصلنا صوت من المحل فعلًا ✓'; }
      else if(waited>=8){ d.className='diag warn'; d.textContent='الاتصال شغّال لكن لسه مسمعناش صوت من المحل. اطلب منهم يتكلموا، وتأكد إن صوت موبايلك مرفوع.'; }
      else { d.className='diag'; d.textContent='الاتصال شغّال… مستنيين صوت المحل'; }
    }catch(_){} },1000);
}
$('muteBtn').onclick=()=>{ if(!S||!S.stream) return; const on=!$('muteBtn').classList.contains('on'); $('muteBtn').classList.toggle('on',on); $('muteBtn').setAttribute('aria-pressed',String(on)); $('muteLbl').textContent=on?'إلغاء الكتم':'كتم'; S.stream.getAudioTracks().forEach(t=>t.enabled=!on); };

function cleanup(){

  failed:['تعذّر توصيل الصوت','الاتصال المباشر بين الموبايلين ماتكوّنش. غالبًا الشبكة (بيانات موبايل أو واي فاي) بتمنعه. جرّب تدخل من نفس الواي فاي اللي عليه المحل، أو تواصل مع المحل عبر واتساب.'],

const SYN=[['شاحن','شواحن','شاحنات','شاحنه','charger','chargers'],['كابل','كابلات','كيبل','كيبلات','cable','cables','سلك'],['سماعه','سماعات','هيدفون','headphone','headphones','earphone','earbuds','ايربودز','airpods'],['موبايل','موبايلات','هاتف','جوال','mobile','smartphone'],['جراب','جرابات','كفر','اغطيه','case','cover'],['ايفون','iphone'],['سامسونج','سامسونغ','samsung'],['هواوي','huawei'],['شاومي','xiaomi','ريدمي','redmi'],['اوبو','oppo'],['ريلمي','realme'],['شاشه','سكرينه','سكرين','screen','protector','حمايه'],['باور','power'],['بطاريه','بطاريات','battery'],['ماوس','mouse','فاره'],['كيبورد','keyboard'],['فلاش','فلاشه','flash'],['لايتنج','لايتننج','lightning']];
const PHR=[[/(تايب|تيب|type)\s*-?\s*(سي|c)\b/g,'§tc',['تايب سي','تيب سي','type c','typec','type-c','usb c','usb-c','usbc']],[/باور\s*بانك|power\s*bank|powerbank/g,'§pb',['باور بانك','power bank','powerbank','شاحن متنقل','بطاريه متنقله']]];
function toQuery(n){
  let s=' '+n+' '; PHR.forEach(p=>{ s=s.replace(p[0],' '+p[1]+' '); });
  const groups=[], used=new Set();
  s.split(' ').filter(Boolean).forEach(t=>{
    let alts=null; const ph=PHR.find(p=>p[1]===t);
    if(ph) alts=ph[2];
    else{
      if(STOP.has(t)||(t.length>2&&t[0]==='و'&&STOP.has(t.slice(1)))) return; if(t.length<2) return;
      let b=t.length>3&&t.startsWith('ال')?t.slice(2):t; if(STOP.has(b)) return;
      const e=SYN.find(g=>g.includes(b)||g.includes(t)); alts=e?e.slice():[b];
      if(!e&&b.length>4&&b.endsWith('ات')) alts.push(b.slice(0,-2));
    }
    alts=alts.map(a=>a.replace(/[,|]/g,' ').trim()).filter(a=>a.length>=2||/^\d$/.test(a));
    if(!alts.length) return; const key=alts[0]; if(used.has(key)) return; used.add(key); groups.push(alts);
  });
  const g=groups.slice(0,6); return {groups:g,str:g.map(a=>a.join('|')).join(',')};
}
const RX={
  hello:/^(ا?هلا|اهلا|مرحبا|مرحبتين|هاي|هلو|السلام عليكم|سلام عليكم|صباح الخير|مساء الخير|ازيك|ازيكم|يا هلا)( .{0,12})?$/,
  thanks:/(شكرا|تسلم|متشكر|الله يكرمك|ميرسي)/,
  hours:/(مواعيد|ساعات (العمل|الشغل)|بتفتح|بتقفل|تفتحوا|تقفلوا|فاتحين|مفتوح|الدوام|امتي (تفتح|تقفل|بتفتحوا|بتقفلوا))/,
  addr:/(عنوان|لوكيشن|موقعكم|موقع المحل|مكانكم|مكان المحل|فين المحل|فينكم|فين مكان|ازاي اجيلكم|اجيلكم)/,
  contact:/(واتس|whats|تواصل|صاحب المحل|صاحب المتجر|اكلم|كلم|مكالم|اتصل|رقم (المحل|صاحب|التواصل|الواتس|التليفون|الموبايل)|رقمكم|رقم تليفون)/,
  cats:/(ايه المنتجات|المنتجات المتاح|المنتجات المتوفر|عندكم ايه|ايه المتاح|ايه اللي عندكم|اقسام|تصنيفات|كل المنتجات|المتاح عندكم)/,
  alt:/(بديل|بدائل|شبه|حاجه تانيه|حاجه مشابهه|مشابه)/,
  priceq:/(سعر|بكام|بكم|كام ثمن|ثمن|كام)/,
  stockq:/(متوفر|موجود|فيه|عندكم|لسه)/
};

/* ---------- ردود ---------- */
async function reply(build){ const rm=typing(); try{ await sleep(260); } finally{ rm(); } await build(); }
function failMsg(e){
  const b=botRow();
  b.textContent=missingFn(e)?'خدمة البحث في منتجات المحل لسه مش متفعّلة. تقدر تتواصل مع المحل مباشرة:':'حصلت مشكلة في الوصول لبيانات المحل دلوقتي. جرّب تاني بعد شوية، أو تواصل مع المحل مباشرة:';
  contactBtns(b); scroll();
}
function notFound(raw){
  const b=botRow(); const w=String(raw||'').trim().slice(0,40);
  b.appendChild(document.createTextNode('مش لاقي «'+w+'» في منتجات المحل دلوقتي. جرّب تكتب الاسم بشكل تاني، أو شوف الأقسام المتاحة، أو اسأل صاحب المحل مباشرة.'));
  const o=el('div','opts'); const x=el('button','opt'); x.type='button'; x.dataset.k='avail'; x.appendChild(el('span','','📦 شوف الأقسام المتاحة')); o.appendChild(x); b.appendChild(o);
  contactBtns(b,null); scroll();
}
function clarify(){
  const b=botRow(); b.textContent='ممكن توضّحلي أكتر؟ اكتب اسم المنتج اللي محتاجه (مثال: شاحن سامسونج)، أو اختار من الأسئلة الجاهزة تحت.'; scroll();
}
async function search(raw,kind){
  const q=toQuery(norm(raw));
  if(!q.groups.length){
    if(last&&(RX.priceq.test(norm(raw))||RX.stockq.test(norm(raw)))) return showOne(last,kind||(RX.priceq.test(norm(raw))?'price':'search'));
    return clarify();
  }
  const r=await rpc('shop_search_products',{p_token:TOKEN,p_q:q.str,p_limit:12});
  if(!r||!r.ok) throw new Error('NOT_OK');
  let items=Array.isArray(r.items)?r.items:[]; if(!items.length) return notFound(raw);
  const best=Math.max.apply(null,items.map(i=>i.score||0)); items=items.filter(i=>(i.score||0)===best); keep(items);
  const exact=best>=(r.groups||q.groups.length);
  if(items.length===1) return showOne(items[0],kind,!exact);
  const b=botRow(); const shown=items.slice(0,6);
  b.appendChild(document.createTextNode((exact?'لقيت '+items.length+' منتجات مناسبة. تقصد أنهي؟':'مفيش مطابق بالظبط، دي أقرب منتجات عندنا. تقصد أنهي؟')+(r.total>shown.length||items.length>shown.length?'\nولو كتبت تفاصيل أدق (الماركة أو الموديل) هضيّق النتائج.':'')));
  options(b,shown,kind==='alt');
}
function showOne(p,kind,approx){
  const b=botRow(); const pp=price(p.price);
  if(kind==='alt'){ b.textContent='تمام، هدورلك على بدائل متاحة لـ «'+p.name+'»…'; scroll(); return alternatives(p); }
  let t=approx?'مش لاقي بالظبط اللي كتبته، أقرب منتج عندنا:\n':'';
  if(kind==='price') t+=pp?('سعر «'+p.name+'»: '+pp+(p.in_stock?' — ومتوفر ✅':' — لكنه غير متوفر حاليًا')):('«'+p.name+'» موجود في المحل بس السعر مش مسجّل. اسأل صاحب المحل مباشرة.');
  else t+=p.in_stock?('«'+p.name+'» متوفر عندنا ✅'+(pp?' وسعره '+pp:'')):('«'+p.name+'» غير متوفر حاليًا'+(pp?' (سعره المسجّل '+pp+')':'')+'. ممكن أوريك بدائل متاحة.');
  b.textContent=t; card(b,p);
}
async function alternatives(p){
  const args={p_token:TOKEN,p_exclude:p.id,p_limit:6,p_instock:true};
  if(p.category_id) args.p_cat=p.category_id; else { const q=toQuery(norm(p.name)); if(q.groups.length) args.p_q=q.groups[0].join('|'); }
  const r=(args.p_cat||args.p_q)?await rpc('shop_search_products',args):{ok:true,items:[]};
  const items=(r&&r.items)||[]; keep(items); const b=botRow();
  if(!items.length){ b.appendChild(document.createTextNode('مفيش بدائل متوفرة مسجّلة دلوقتي لـ «'+p.name+'». اسأل صاحب المحل مباشرة، يمكن عنده حاجة مناسبة.')); contactBtns(b,p.name); scroll(); return; }
  b.appendChild(document.createTextNode('دي بدائل متاحة قريبة من «'+p.name+'»:')); options(b,items.slice(0,6));
}
async function categories(){
  const r=await rpc('shop_categories',{p_token:TOKEN}); const b=botRow();
  if(!Array.isArray(r)||!r.length){ b.textContent='لسه مفيش أقسام مسجّلة. اكتب اسم المنتج اللي محتاجه وأدورلك عليه.'; scroll(); return; }
  b.appendChild(document.createTextNode('دي أقسام المحل المتاحة. اختار قسم وأوريك المنتجات المتوفرة فيه:'));
  const o=el('div','opts'); r.forEach(c=>{ const x=el('button','opt'); x.type='button'; x.dataset.cat=c.id; x.dataset.cn=c.name||''; x.appendChild(el('span','',c.name||'قسم')); x.appendChild(el('small','',(c.n||0)+' منتج')); o.appendChild(x); }); b.appendChild(o); scroll();
}
async function inCategory(id,name){
  const r=await rpc('shop_search_products',{p_token:TOKEN,p_cat:id,p_instock:true,p_limit:8}); const items=(r&&r.items)||[]; keep(items); const b=botRow();
  if(!items.length){ b.textContent='مفيش منتجات متوفرة في قسم «'+name+'» دلوقتي.'; scroll(); return; }
  b.appendChild(document.createTextNode('المتوفر في «'+name+'»:'+(r.total>items.length?'\nفيه منتجات أكتر، اكتب اسم المنتج لو بتدور على حاجة معينة.':''))); options(b,items);
}
function showInfo(){
  const b=botRow(); const L=[]; const a=info&&info.address, h=info&&info.hours;
  if(a) L.push('📍 العنوان: '+a); if(h) L.push('🕒 مواعيد العمل: '+h);
  if(!L.length){ b.appendChild(document.createTextNode('صاحب المحل لسه ما سجّلش العنوان ولا المواعيد هنا. تقدر تسأله مباشرة:')); contactBtns(b); }
  else { b.appendChild(document.createTextNode(L.join('\n')+((!a||!h)?'\n(باقي البيانات لسه مش مسجّلة، اسأل صاحب المحل مباشرة.)':''))); contactBtns(b); }
  scroll();
}
function showContact(){
  const b=botRow(); b.appendChild(document.createTextNode(waDigits()?'تقدر تتواصل مع صاحب المحل بالطريقة اللي تريحك:':'رقم واتساب مش متاح حاليًا. تقدر تتصل بالمحل مباشرة من هنا:')); contactBtns(b); scroll();
}

/* ---------- تنفيذ الأزرار والنصوص ---------- */
const PROMPT={search:'اكتب اسم المنتج اللي بتدور عليه (مثال: شاحن سامسونج تايب سي).',price:'اكتب اسم المنتج وأقولك سعره المسجّل.',alt:'اكتب اسم المنتج وأدورلك على بدائل متاحة.'};
const PH={search:'اكتب اسم المنتج أو سؤالك…',price:'اسم المنتج اللي عايز تعرف سعره…',alt:'اسم المنتج اللي عايز له بديل…'};
function setMode(m){ mode=m; inp.placeholder=PH[m]||PH.search; }
async function guarded(fn){
  if(busy) return; busy=true; sendBtn.disabled=true;
  try{ await reply(fn); }
  catch(e){ failMsg(e); }
  finally{ busy=false; sendBtn.disabled=false; }
}
function doKey(k){
  if(off) return; const q=QS.find(x=>x[0]===k); userSay(q[2]);
  if(PROMPT[k]){ setMode(k); guarded(async()=>{ say(PROMPT[k]); }).then(()=>{ try{ inp.focus(); }catch(_){} }); return; }
  setMode('search');
  if(k==='avail') guarded(categories); else if(k==='info') guarded(async()=>showInfo()); else if(k==='contact') guarded(async()=>showContact());
}
function handleText(raw){
  if(off) return; const n=norm(raw); if(!n) return; userSay(raw.trim()); const m=mode; setMode('search');
  guarded(async()=>{
    if(RX.hello.test(n)) return void say('أهلًا بيك في '+shop+' 👋 اكتب اسم المنتج اللي بتدور عليه، أو اختار من الأسئلة الجاهزة.');
    if(RX.thanks.test(n)&&n.split(' ').length<=4) return void say('العفو! لو محتاج أي حاجة تانية أنا هنا 🙌');
    if(RX.hours.test(n)||RX.addr.test(n)) return showInfo();
    if(RX.contact.test(n)) return showContact();
    if(RX.cats.test(n)) return categories();
    if(m==='alt'||RX.alt.test(n)){
      const q=toQuery(n); if(!q.groups.length&&last) return alternatives(last);
      return search(raw,'alt');
    }
    return search(raw,m==='price'||(RX.priceq.test(n)&&!/(متوفر|موجود)/.test(n))?'price':'search');
  });
}
chat.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.k){ doKey(t.dataset.k); return; }
  if(t.dataset.call){ const cb=$('callBtn'); if(cb&&!cb.disabled) cb.click(); else guarded(async()=>say('المحل مش متاح للرد على المكالمات دلوقتي. جرّب واتساب أو ارجع بعد شوية.')); return; }
  if(t.dataset.cat){ if(busy) return; userSay(t.dataset.cn||'القسم'); const id=t.dataset.cat, nm=t.dataset.cn||''; guarded(()=>inCategory(id,nm)); return; }
  if(t.dataset.id){ const p=seen.get(t.dataset.id); if(!p||busy) return; userSay(p.name); if(t.dataset.altmode) guarded(()=>alternatives(p)); else guarded(async()=>showOne(p,'search')); return; }
  if(t.dataset.alt){ const p=seen.get(t.dataset.alt)||last; if(!p||busy) return; userSay(p.in_stock?'منتجات مشابهة':'شوف البدائل المتاحة'); guarded(()=>alternatives(p)); }
});
$('qstrip').addEventListener('click',e=>{ const t=e.target.closest('button[data-k]'); if(t) doKey(t.dataset.k); });
$('qf').addEventListener('submit',e=>{ e.preventDefault(); const v=inp.value; if(!v.trim()||busy) return; inp.value=''; handleText(v); });

/* ---------- الإقلاع ---------- */
function disable(msg){ off=true; inp.disabled=true; sendBtn.disabled=true; inp.placeholder=msg; }
async function init(){
  fillStrip();
  if(!TOKEN){ say('رابط المحل غير مكتمل. اطلب من المحل يبعتلك الرابط الصحيح.'); disable('الشات غير متاح'); return; }
  try{
    info=await rpc('shop_public_info',{p_token:TOKEN});
    if(!info||!info.ok){ say('الرابط ده غير صالح أو الصفحة متوقفة عند المحل.'); disable('الشات غير متاح'); return; }
    shop=info.name||shop; wa=info.whatsapp||null; $('shop').textContent=shop; $('logo').textContent=(shop.trim()[0]||'م');
    const u=waUrl(null); if(u){ const a=$('waBtn'); a.href=u; a.classList.remove('hide'); }
    const b=botRow(); b.textContent='أهلًا بيك في '+shop+' 👋\n\nنورتنا! أنا هنا أساعدك تلاقي المنتج اللي بتدور عليه، وأجاوبك عن الأسعار والمنتجات المتاحة ومعلومات المحل.\n\nتحب أساعدك في إيه؟';
    const g=el('div','qgrid'); QS.forEach(q=>g.appendChild(qBtn(q[0],false))); b.appendChild(g); chat.scrollTop=0;
  }catch(e){
    for(let i=0;i<20&&$('shop').textContent.trim()==='…';i++) await sleep(150);
    const nm=$('shop').textContent.trim(); if(nm&&nm!=='…') shop=nm;
    if(missingFn(e)){ say('أهلًا بيك في '+shop+' 👋\nخدمة البحث في المنتجات لسه مش متفعّلة عند المحل، بس تقدر تتصل بالمحل مباشرة من الزر تحت.'); disable('البحث غير متاح حاليًا'); }
    else { const b=botRow(); b.textContent='مقدرتش أوصل لبيانات المحل دلوقتي. اتأكد من النت وجرّب تاني.'; const r=el('button','ibtn c'); r.type='button'; r.textContent='🔄 إعادة المحاولة'; r.onclick=()=>{ chat.textContent=''; started=false; init(); }; b.appendChild(r); }
  }
}
window.__store={init,toQuery,norm,get shop(){return shop;}};
init();
})();
